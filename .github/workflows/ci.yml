name: ci
# Tests on every push and pull request; a tag vX.Y.Z publishes to crates.io. crates.io trusts a workflow
# only for a crate that already exists, so the first version goes out with a token the owner puts in the
# repository secret CARGO_REGISTRY_TOKEN; after it, the owner links this workflow on crates.io (trusted
# publishing, OIDC) and deletes the secret.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.75", "stable"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - run: cargo fmt --check
        if: matrix.rust == 'stable'
      - run: cargo clippy --all-targets -- -D warnings
        if: matrix.rust == 'stable'
      - run: cargo test --all-targets
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}   # secrets cannot be read in a step's if
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
        if: env.HAS_TOKEN != 'true'
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
